<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swoqy · Mobile games &amp; apps</title>
<meta name="description" content="Swoqy makes mobile games and apps.">
<style>
  :root { --bg:#0e1114; --panel:#161b20; --line:#232a31; --ink:#e9edf1; --muted:#9aa5b1; --accent:#5bb8ec; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:44px; margin:0; letter-spacing:-.5px; }
  .tag { color:var(--muted); font-size:18px; margin:6px 0 40px; }
  h2 { font-size:14px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 0 14px; }
  .card { display:flex; gap:18px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .card img { width:72px; height:72px; border-radius:16px; flex:none; }
  .card h3 { margin:0; font-size:20px; }
  .card p { margin:4px 0 8px; color:var(--muted); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .links a { margin-right:16px; font-size:14px; }
  footer { margin-top:56px; color:var(--muted); font-size:14px; border-top:1px solid var(--line); padding-top:18px; }
  @media (max-width:520px) { h1 { font-size:34px; } .card { align-items:flex-start; } }
</style>
</head>
<body>
<main>
  <h1>Swoqy</h1>
  <p class="tag">Mobile games and apps.</p>

  <h2>Games</h2>
  <div class="card">
    <img src="apps/billiards-hustle/icon.png" alt="Billiards Hustle icon">
    <div>
      <h3>Billiards Hustle</h3>
      <p>3-cushion and carom billiards against bots on four tables. Aim, pull back, release.</p>
      <div class="links">
        <a href="https://play.google.com/store/apps/details?id=com.billiardshustle.game">Google Play</a>
        <a href="apps/billiards-hustle/privacy.html">Privacy policy</a>
      </div>
    </div>
  </div>

  <footer>© 2026 Swoqy · <a href="mailto:info@swoqy.com">info@swoqy.com</a></footer>
</main>
</body>
</html>
