<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunroom Mahjong · Family Tiles</title>
<meta name="description" content="Mahjong solitaire with your family photos on the tiles. Play together with your grandchild.">
<meta property="og:title" content="Sunroom Mahjong: Family Tiles">
<meta property="og:description" content="Mahjong solitaire with your family photos on the tiles.">
<meta property="og:image" content="https://swoqy.com/apps/sunroom-mahjong/icon.png">
<style>
  :root { --bg:#fff7e8; --ink:#34261a; --accent:#1f7a55; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--ink); font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { text-align:center; padding:32px 20px; max-width:420px; }
  img { width:120px; height:120px; border-radius:26px; box-shadow:0 6px 24px rgba(0,0,0,.15); }
  h1 { font-size:28px; margin:18px 0 4px; }
  p { margin:0 0 24px; color:#5c4a2a; }
  a.btn { display:block; margin:12px 0; padding:16px; border-radius:16px; background:var(--accent);
          color:#fff; text-decoration:none; font-weight:700; font-size:20px; }
</style>
<script>
  // Phones go straight to their store; everyone else sees both buttons.
  var ua = navigator.userAgent || "";
  var ios = "https://apps.apple.com/app/id6820140201";
  var play = "https://play.google.com/store/apps/details?id=com.swoqy.mahjong";
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document)) location.replace(ios);
  else if (/Android/.test(ua)) location.replace(play);
</script>
</head>
<body>
<main>
  <img src="/apps/sunroom-mahjong/icon.png" alt="">
  <h1>Sunroom Mahjong</h1>
  <p>Mahjong solitaire with your family photos on the tiles.</p>
  <a class="btn" href="https://apps.apple.com/app/id6820140201">App Store</a>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.swoqy.mahjong">Google Play</a>
</main>
</body>
</html>
